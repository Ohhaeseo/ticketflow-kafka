spring:
  application:
    name: ticketflow
  # 루트의 .env를 읽는다 (backend/에서 실행하면 ../.env). 없으면 기본값을 쓴다.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:ticketflow}
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      # Redis가 죽었을 때 요청이 오래 묶이지 않도록 짧게 둔다 (빈도 제한은 fail-open).
      # 실패 후 5초 동안은 Redis를 부르지 않으므로 이 대기는 쿨다운마다 한 번만 생긴다.
      timeout: 500ms
      connect-timeout: 1s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ticketflow-reservation
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        # 정적 멤버십: 프로세스가 강제 종료된 뒤 다시 떠도 같은 instance id로 파티션을 즉시 돌려받는다.
        # 없으면 브로커가 죽은 멤버를 session.timeout.ms(45초)까지 기다린 뒤 재할당한다 (6주차 장애 실험).
        # 리스너 컨테이너가 Consumer마다 -0, -1, -2를 붙인다. 인스턴스를 여러 개 띄우면 인스턴스마다 다른 값을 준다.
        group.instance.id: ${KAFKA_GROUP_INSTANCE_ID:ticketflow-local-1}
    listener:
      ack-mode: record # 레코드 처리(=DB 커밋)가 끝난 뒤 오프셋 커밋
      concurrency: 3   # 파티션 수와 같게. 공연 하나의 메시지는 key 때문에 한 스레드가 순서대로 처리한다

server:
  port: ${SERVER_PORT:8080}

ticketflow:
  kafka:
    reservation-requested-topic: reservation.requested.v1
    reservation-requested-dlt-topic: reservation.requested.v1-dlt
    partitions: 3          # PRD Q6
    replication-factor: 1  # 로컬 단일 브로커
  reservation:
    # async: 접수(202) 후 Outbox → Kafka → Consumer가 확정. sync: 벤치마크 비교용, 요청 안에서 바로 확정(201)
    processing-mode: async
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 100   # 직전 실행이 끝난 뒤 100ms 후 다시 폴링
      batch-size: 200
      send-timeout-ms: 5000
  rate-limit:
    reservation:
      enabled: true
      # 사용자별 예약 시도: 첫 요청부터 window 동안 max-requests회까지 (PRD FR-RL-01, SEC-01)
      max-requests: 20
      window: 10s
      # Redis 오류 후 이 시간 동안은 Redis를 부르지 않고 바로 허용한다 (fail-open, PRD Q5)
      fail-open-cooldown: 5s
  monitoring:
    refresh-ms: 5000 # Outbox·lag·DLT 지표 갱신 주기
  admin:
    local-endpoints-enabled: false
  test-auth:
    enabled: false # 켜지 않으면 사용자 식별이 필요한 API는 모두 401

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    redis:
      # Redis는 빈도 제한 전용이고 fail-open이다. Redis 장애로 앱 전체가 DOWN(재시작 대상)이 되지 않게 한다.
      # Redis 상태는 ticketflow_ratelimit_fail_open_total / redis_failures_total 지표로 본다.
      enabled: false

# API 문서는 local 프로필에서만 연다 (application-local.yml)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.apache.kafka: WARN
