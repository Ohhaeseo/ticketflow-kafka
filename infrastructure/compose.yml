# TicketFlow Kafka — 로컬 인프라 (PRD §14.2)
#
# 실행 (저장소 루트에서):
#   docker compose -f infrastructure/compose.yml --env-file .env up -d
#
# 규칙
#   - 이미지 태그는 버전을 고정한다. `latest` 금지 (NFR-REP-02).
#     테스트(Testcontainers)도 같은 태그를 쓴다: backend/src/test/java/com/ticketflow/support/TestcontainersConfiguration.java
#   - 호스트 포트는 127.0.0.1에만 바인딩한다 (NFR-SEC-01).
#   - 비밀값은 루트의 .env에서 읽는다 (.env.example 참고).
#   - Redis는 7주차에 추가한다.

name: ticketflow

services:
  postgres:
    image: postgres:18.7-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18+ 이미지는 /var/lib/postgresql 아래에 버전별 디렉터리를 만든다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft single-node (broker + controller). 로컬 개발용이며 HA 클러스터를 대신하지 않는다.
    image: apache/kafka:4.3.2
    container_name: ticketflow-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # 토픽은 애플리케이션(NewTopic 빈) 또는 CLI로만 만든다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  kafka-data:
